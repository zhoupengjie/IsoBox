[workspace]
members = [".", "gui"]
resolver = "3"

[package]
name = "isobox"
version = "0.1.0"
edition = "2024"
description = "以独立 Windows 账户运行不信任的桌面软件，让它读不到你的文件"
license = "GPL-3.0-or-later"
repository = "https://github.com/zhoupengjie/IsoBox"
publish = false

[[bin]]
name = "isobox-setup"
path = "src/bin/setup.rs"

[[bin]]
name = "isobox"
path = "src/bin/launch.rs"

[[bin]]
name = "isobox-launch"
path = "src/bin/gui_launch.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
png = "0.18.1"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Threading", "Win32_NetworkManagement_NetManagement", "Win32_Security_Authorization", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Security_Isolation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_System_Ioctl", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_RemoteDesktop", "Win32_Globalization"] }
