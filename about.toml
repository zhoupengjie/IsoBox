# cargo about 的配置：生成随安装包分发的第三方许可证声明（installer\build.ps1 调用）。
# 新依赖用了这里没有的许可证时 cargo about 会报错，确认可以随二进制分发后再加进来。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
]
# 只列进入程序的库：开发和编译时用的工具不随程序分发
ignore-build-dependencies = true
ignore-dev-dependencies = true
# 不列 IsoBox 自己（publish = false 的 isobox、isobox-gui）：它的 GPL-3.0 单独放在 licenses\LICENSE.txt
private = { ignore = true }
