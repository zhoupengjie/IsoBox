# 发布：推送 v1.2.3 这样的标签后，生成安装包，建一个 GitHub Release 草稿（安装包、SHA-256、CHANGELOG 里这个版本的说明）。
# 草稿要人工检查后再点“发布”。
#
# 步骤：scripts\set-version.ps1 1.2.3 → 在 CHANGELOG.md 写上 [1.2.3] 一节 → 提交 → 等 CI 通过
#       → git tag v1.2.3 → git push origin v1.2.3
#
# 代码签名还没接上：申请到 SignPath 等签名服务后，在“生成安装包”之后加签名步骤，见 ROADMAP.md 阶段四“代码签名”。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: 生成安装包和发布草稿
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: 标签要和版本号一致
        shell: powershell
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $m = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $m.Matches[0].Groups[1].Value
          if ($env:TAG -ne "v$version") { throw "标签 $env:TAG 和 Cargo.toml 的版本 $version 不一致" }
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安装 cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9

      - name: 确保有 7-Zip
        shell: powershell
        run: |
          if (-not (Test-Path 'C:\Program Files\7-Zip\7z.exe')) { choco install 7zip -y --no-progress }

      - name: 生成安装包
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File installer\build.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 从 CHANGELOG.md 取出这个版本的说明
        shell: powershell
        run: |
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = [array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match "^## \[$([regex]::Escape($env:VERSION))\]" })
          if ($start -lt 0) { throw "CHANGELOG.md 里没有 [$env:VERSION] 这一节" }
          $notes = @()
          for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notmatch '^## '; $i++) { $notes += $lines[$i] }
          $notes += '', "安装包的 SHA-256 见 IsoBox-$env:VERSION-setup.exe.sha256。"
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.md", ($notes -join "`n"), (New-Object Text.UTF8Encoding $false))

      - name: 建发布草稿
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:TAG --draft --title "IsoBox $env:VERSION" --notes-file "$env:RUNNER_TEMP\notes.md" `
            "target\installer\IsoBox-$env:VERSION-setup.exe" "target\installer\IsoBox-$env:VERSION-setup.exe.sha256"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
